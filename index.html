<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AU History Forensic Portal</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --cobalt: #001f3f; --gold: #ffca28; --paper: #fdfaf5; --danger: #b71c1c; --green: #2e7d32; }
        
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; height: 100vh; background: var(--paper); color: #333; }
        
        /* Responsive Header */
        #header { 
            padding: 12px; background: var(--cobalt); color: white; 
            display: grid; grid-template-columns: 1fr; gap: 12px;
            z-index: 1001; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        @media (min-width: 768px) {
            #header { grid-template-columns: 2fr 1fr 1fr auto; padding: 15px 25px; align-items: flex-end; }
        }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 10px; text-transform: uppercase; color: var(--gold); font-weight: bold; }
        
        input, button { padding: 12px; border-radius: 6px; border: 1px solid #444; font-size: 14px; width: 100%; }
        input[type="range"] { padding: 5px 0; }
        
        .btn-main { background: var(--gold); color: #000; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        .btn-main:active { transform: scale(0.98); background: #e0a816; }

        #settings-bar { 
            background: #00152b; padding: 10px 15px; display: flex; 
            align-items: center; justify-content: space-between; 
            border-bottom: 2px solid var(--gold); z-index: 1000; 
        }
        
        /* Layout: Map vs Results */
        #map { flex: 0 0 40vh; width: 100%; position: relative; }
        @media (min-width: 768px) { #map { flex: 1; } }
        
        #results-container { 
            display: flex; flex-direction: column; background: white; 
            border-top: 1px solid #ccc; overflow-y: auto; 
        }
        @media (min-width: 768px) { 
            #results-container { flex-direction: row; height: 350px; overflow: hidden; } 
        }

        #incident-feed { flex: 1.8; overflow-y: auto; border-bottom: 1px solid #ddd; padding: 15px; }
        #news-archive { flex: 1.2; overflow-y: auto; background: #f4f4f4; padding: 15px; }
        @media (min-width: 768px) { #incident-feed { border-bottom: none; border-right: 1px solid #ddd; } }

        .section-title { font-size: 11px; font-weight: 900; color: var(--cobalt); border-bottom: 2px solid var(--cobalt); margin-bottom: 12px; padding-bottom: 4px; text-transform: uppercase; }
        
        /* Event Cards */
        .item-card { border-bottom: 1px solid #eee; padding: 14px 10px; display: block; text-decoration: none; color: inherit; position: relative; }
        .item-title { font-weight: bold; font-size: 15px; color: var(--danger); margin-bottom: 4px; padding-right: 60px; line-height: 1.3; }
        .type-tag { position: absolute; top: 14px; right: 10px; font-size: 9px; font-weight: bold; background: #ddd; padding: 3px 6px; border-radius: 4px; }
        .item-meta { font-size: 11px; color: #666; font-family: monospace; }

        /* News Links */
        .news-group { margin-bottom: 20px; background: white; padding: 12px; border-radius: 6px; border: 1px solid #ccc; }
        .news-group h4 { margin: 0 0 10px 0; font-size: 13px; color: var(--cobalt); border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .news-btn { display: block; padding: 12px; background: #fdfdfd; color: #004a99; text-decoration: none; border: 1px solid #ddd; border-radius: 6px; font-size: 12px; margin-bottom: 8px; font-weight: bold; text-align: center; }

        /* Toggle */
        .switch-container { display: flex; align-items: center; gap: 8px; color: white; font-size: 11px; font-weight: bold; }
        .switch { position: relative; width: 40px; height: 22px; display: inline-block; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; transition: .3s; border-radius: 22px; border: 1px solid var(--gold); }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 2px; background: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background: var(--green); }
        input:checked + .slider:before { transform: translateX(18px); }

        #loader { display: none; color: var(--gold); font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div id="header">
    <div class="input-group">
        <label>Investigation Site (AU)</label>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="addressInput" placeholder="Suburb or Town">
            <button onclick="searchAddress()" style="background:#333; color:white; width: auto;">GO</button>
        </div>
    </div>
    <div class="input-group">
        <label>Radius: <span id="radLabel">5</span> km</label>
        <input type="range" id="radius" min="1" max="50" value="5">
    </div>
    <div class="input-group">
        <label>Year Range</label>
        <div style="display: flex; gap: 5px;">
            <input type="number" id="startYear" value="1900">
            <input type="number" id="endYear" value="2000">
        </div>
    </div>
    <button class="btn-main" onclick="runForensicSearch()">SEARCH RECORDS</button>
</div>

<div id="settings-bar">
    <div class="switch-container">
        <span>EXCLUDE LANDMARKS</span>
        <label class="switch">
            <input type="checkbox" id="landmarkToggle">
            <span class="slider"></span>
        </label>
        <span>INCLUDE</span>
    </div>
    <div id="loader">SEARCHING...</div>
</div>

<div id="map"></div>

<div id="results-container">
    <div id="incident-feed">
        <div class="section-title">Historical Records</div>
        <div id="listContent" style="color:#888; font-size:13px; text-align: center; padding-top: 20px;">Move pin and search.</div>
    </div>
    <div id="news-archive">
        <div class="section-title">Newspaper Investigation Leads</div>
        <div id="newsLeads"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    let localSuburbs = [];
    const map = L.map('map').setView([-37.81, 144.96], 12); 
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let pin, circle, markers = L.layerGroup().addTo(map);

    async function searchAddress() {
        const q = document.getElementById('addressInput').value;
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q + ", Australia")}&addressdetails=1`);
        const data = await res.json();
        if (data.length > 0) updateSelection(data[0].lat, data[0].lon, 14);
    }

    async function getSuburbs(lat, lng, rad) {
        const query = `[out:json];(node["place"~"suburb|town|village"](around:${rad * 1000},${lat},${lng}););out;`;
        try {
            const res = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query));
            const data = await res.json();
            return [...new Set(data.elements.map(el => el.tags.name))];
        } catch (e) { return []; }
    }

    function updateSelection(lat, lng, zoom) {
        if (zoom) map.setView([lat, lng], zoom);
        const r = document.getElementById('radius').value;
        if (pin) {
            pin.setLatLng([lat, lng]);
            circle.setLatLng([lat, lng]);
            circle.setRadius(r * 1000);
        } else {
            pin = L.marker([lat, lng], {draggable: true}).addTo(map);
            circle = L.circle([lat, lng], { radius: r * 1000, color: '#ffca28', fillOpacity: 0.1 }).addTo(map);
        }
    }

    map.on('click', e => updateSelection(e.latlng.lat, e.latlng.lng));
    document.getElementById('radius').oninput = (e) => {
        document.getElementById('radLabel').innerText = e.target.value;
        if (circle) circle.setRadius(e.target.value * 1000);
    };

    async function runForensicSearch() {
        if (!pin) return alert("Select a location.");
        const {lat, lng} = pin.getLatLng();
        const rad = document.getElementById('radius').value;
        const start = document.getElementById('startYear').value;
        const end = document.getElementById('endYear').value;
        const showLandmarks = document.getElementById('landmarkToggle').checked;

        document.getElementById('loader').style.display = "block";
        document.getElementById('listContent').innerHTML = "";
        document.getElementById('newsLeads').innerHTML = "";
        markers.clearLayers();

        localSuburbs = await getSuburbs(lat, lng, rad);
        generateNewsDossiers(localSuburbs, start, end);

        await Promise.all([
            fetchWikidataEvents(lat, lng, rad, start, end, showLandmarks),
            ...localSuburbs.slice(0, 3).map(s => fetchWikipediaEvents(s, start, end))
        ]);

        document.getElementById('loader').style.display = "none";
        // Smooth scroll to results on mobile
        if (window.innerWidth < 768) {
            document.getElementById('results-container').scrollIntoView({ behavior: 'smooth' });
        }
    }

    async function fetchWikidataEvents(lat, lng, rad, s, e, showL) {
        const incidents = "wd:Q838948 wd:Q171558 wd:Q1100989 wd:Q1543115 wd:Q3839 wd:Q214841 wd:Q132241";
        const landmarks = "wd:Q1081138 wd:Q575759 wd:Q49833";
        const types = showL ? (incidents + " " + landmarks) : incidents;

        const query = `SELECT DISTINCT ?item ?itemLabel ?date ?loc ?type WHERE {
            SERVICE wikibase:around {
                ?item wdt:P625 ?loc .
                bd:serviceParam wikibase:center "Point(${lng} ${lat})"^^geo:wktLiteral .
                bd:serviceParam wikibase:radius "${rad}" .
            }
            ?item wdt:P31/wdt:P279* ?type .
            VALUES ?type { ${types} }
            MINUS { ?item wdt:P31/wdt:P279* wd:Q300920 } 
            ?item wdt:P585|wdt:P580 ?date .
            FILTER(YEAR(?date) >= ${s} && YEAR(?date) <= ${e})
            SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
        } LIMIT 50`;

        try {
            const res = await fetch("https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(query));
            const data = await res.json();
            data.results.bindings.forEach(row => {
                const isL = ["Q1081138","Q575759","Q49833"].some(q => row.type.value.includes(q));
                renderItem(row.itemLabel.value, new Date(row.date.value).getFullYear(), row.item.value, isL, row.loc.value, "MAPPED");
            });
        } catch(e) {}
    }

    async function fetchWikipediaEvents(suburb, s, e) {
        const query = `"${suburb}" (murder OR crime OR accident OR disaster OR visit) -sport`;
        const url = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
        try {
            const res = await fetch(url);
            const data = await res.json();
            data.query.search.forEach(item => {
                const yearMatch = item.snippet.match(/\b(19\d{2}|2000)\b/);
                if (yearMatch) {
                    renderItem(item.title, yearMatch[0], `https://en.wikipedia.org/?curid=${item.pageid}`, false, null, "WIKI");
                }
            });
        } catch(e) {}
    }

    function renderItem(title, yr, url, isL, locStr, source) {
        if (locStr) {
            const c = locStr.replace("Point(","").replace(")","").split(" ");
            L.circleMarker([c[1], c[0]], { 
                radius: 8, fillColor: isL ? '#2e7d32' : '#b71c1c', color: '#000', weight: 1, fillOpacity: 0.8 
            }).addTo(markers).bindPopup(`<b>${title}</b><br>${yr}`);
        }

        const card = document.createElement('a');
        card.className = 'item-card'; card.href = url; card.target = "_blank";
        card.innerHTML = `
            <div class="item-title">${title}</div>
            <div class="type-tag" style="background:${source === 'MAPPED' ? '#e3f2fd' : '#fff9c4'}">${source}</div>
            <div class="item-meta">YEAR: ${yr} | ${isL ? 'LANDMARK' : 'INCIDENT'}</div>
        `;
        document.getElementById('listContent').prepend(card);
    }

    function generateNewsDossiers(suburbs, start, end) {
        const container = document.getElementById('newsLeads');
        const terms = `(murder OR crime OR accident OR visit OR disaster) -sport -results`;
        
        suburbs.slice(0, 5).forEach(sub => {
            const group = document.createElement('div');
            group.className = 'news-group';
            group.innerHTML = `<h4>Investigation: ${sub}</h4>`;
            
            const trove = document.createElement('a');
            trove.className = 'news-btn'; trove.target = "_blank";
            trove.href = `https://trove.nla.gov.au/search/advanced/category/newspaper?keyword=${encodeURIComponent(sub + " " + terms.replace(/[()]/g,""))}&dateFrom=${start}-01-01&dateTo=${end}-12-31`;
            trove.innerText = `Search Trove Newspapers`;
            group.appendChild(trove);

            const major = document.createElement('a');
            major.className = 'news-btn'; major.target = "_blank";
            major.href = `https://www.google.com/search?q=site:theage.com.au+OR+site:smh.com.au+"${encodeURIComponent(sub)}"+${encodeURIComponent(terms)}+${start}..${end}`;
            major.innerText = `Search Archive Papers`;
            group.appendChild(major);

            container.appendChild(group);
        });
    }
</script>
</body>
</html>
