<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AU News Intelligence Portal</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --ink: #1a1a1a; --paper: #fdfaf5; --accent: #004a99; --gold: #d4af37; --danger: #8b0000; }
        body { margin: 0; font-family: 'Segoe UI', serif; display: flex; flex-direction: column; height: 100vh; background: var(--paper); }
        
        #header { padding: 15px 25px; background: var(--ink); color: white; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; z-index: 1001; }
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 10px; text-transform: uppercase; color: var(--gold); font-weight: bold; }
        input, button { padding: 8px; border-radius: 4px; border: 1px solid #444; font-size: 13px; }
        .btn-main { background: var(--gold); color: black; font-weight: bold; cursor: pointer; border: none; min-width: 180px; }
        
        #map { flex: 1 0 300px; width: 100%; border-bottom: 3px solid var(--gold); }
        
        #intel-container { display: flex; height: 400px; background: white; border-top: 1px solid #ccc; overflow: hidden; }
        #suburb-list { flex: 1; overflow-y: auto; border-right: 1px solid #ddd; padding: 15px; background: #f9f9f9; }
        #news-dossier { flex: 2; overflow-y: auto; padding: 15px; }

        .section-title { font-size: 12px; font-weight: 900; color: var(--ink); border-bottom: 2px solid var(--ink); margin-bottom: 12px; padding-bottom: 4px; text-transform: uppercase; }
        
        .suburb-chip { display: inline-block; padding: 4px 8px; background: #e0e0e0; margin: 2px; border-radius: 3px; font-size: 12px; font-weight: 500; }
        
        .dossier-card { border: 1px solid #ddd; padding: 12px; margin-bottom: 15px; border-radius: 5px; background: white; }
        .dossier-card h4 { margin: 0 0 10px 0; color: var(--danger); border-bottom: 1px solid #eee; padding-bottom: 5px; }
        
        .news-link { 
            display: inline-block; padding: 6px 12px; margin: 4px 2px; 
            background: white; color: var(--accent); text-decoration: none; 
            border: 1px solid var(--accent); border-radius: 4px; font-size: 11px; font-weight: bold;
        }
        .news-link:hover { background: var(--accent); color: white; }
        .trove-btn { background: var(--danger) !important; color: white !important; border-color: var(--danger) !important; }

        #loader { display: none; color: var(--gold); font-size: 12px; font-weight: bold; margin-left: 10px; }
    </style>
</head>
<body>

<div id="header">
    <div class="input-group" style="flex: 2;">
        <label>1. Investigation Center</label>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="addressInput" placeholder="Suburb or City" style="flex:1">
            <button onclick="searchAddress()" style="background:#333; color:white;">Set ROI</button>
        </div>
    </div>
    <div class="input-group">
        <label>2. Radius: <span id="radLabel">5</span> km</label>
        <input type="range" id="radius" min="1" max="50" value="5">
    </div>
    <div class="input-group">
        <label>3. Dates (1900-2000)</label>
        <div style="display: flex; gap: 5px;">
            <input type="number" id="startYear" value="1900" style="width:70px">
            <input type="number" id="endYear" value="2000" style="width:70px">
        </div>
    </div>
    <button class="btn-main" onclick="runIntelligenceHarvest()">HARVEST NEWS INTEL</button>
</div>

<div id="map"></div>

<div id="intel-container">
    <div id="suburb-list">
        <div class="section-title">Suburbs within Radius</div>
        <div id="suburbContent"><small>Click "Harvest" to identify localities.</small></div>
    </div>
    <div id="news-dossier">
        <div class="section-title">News Archive Dossiers</div>
        <div id="loader">POLLING GEOSPATIAL DATA...</div>
        <div id="dossierContent">
            <p style="color: #666; font-style: italic;">Identify a region of interest on the map to generate news archive leads.</p>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const map = L.map('map').setView([-37.8136, 144.9631], 12); 
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let pin, circle;

    // Initial positioning
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => updateSelection(pos.coords.latitude, pos.coords.longitude, 13));
    }

    async function searchAddress() {
        const query = document.getElementById('addressInput').value;
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ", Australia")}`);
        const data = await res.json();
        if (data.length > 0) updateSelection(data[0].lat, data[0].lon, 14);
    }

    function updateSelection(lat, lng, zoom) {
        if (zoom) map.setView([lat, lng], zoom);
        const r = document.getElementById('radius').value;
        if (pin) { pin.setLatLng([lat, lng]); circle.setLatLng([lat, lng]); circle.setRadius(r * 1000); }
        else {
            pin = L.marker([lat, lng], {draggable: true}).addTo(map);
            circle = L.circle([lat, lng], { radius: r * 1000, color: '#d4af37', fillOpacity: 0.1 }).addTo(map);
        }
    }

    map.on('click', e => updateSelection(e.latlng.lat, e.latlng.lng));
    document.getElementById('radius').oninput = (e) => {
        document.getElementById('radLabel').innerText = e.target.value;
        if (circle) circle.setRadius(e.target.value * 1000);
    };

    async function runIntelligenceHarvest() {
        if (!pin) return alert("Select a location.");
        const {lat, lng} = pin.getLatLng();
        const rad = document.getElementById('radius').value;
        const start = document.getElementById('startYear').value;
        const end = document.getElementById('endYear').value;

        document.getElementById('loader').style.display = "block";
        document.getElementById('suburbContent').innerHTML = "";
        document.getElementById('dossierContent').innerHTML = "";

        // 1. HARVEST SUBURBS IN RADIUS (Overpass API)
        const overpassQuery = `[out:json];(node["place"~"suburb|town|village"](around:${rad * 1000},${lat},${lng}););out;`;
        try {
            const res = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(overpassQuery));
            const data = await res.json();
            const suburbs = [...new Set(data.elements.map(el => el.tags.name))].sort();

            if (suburbs.length === 0) {
                document.getElementById('suburbContent').innerHTML = "No distinct suburbs identified.";
                document.getElementById('loader').style.display = "none";
                return;
            }

            suburbs.forEach(s => {
                const span = document.createElement('span');
                span.className = 'suburb-chip';
                span.innerText = s;
                document.getElementById('suburbContent').appendChild(span);
                
                // 2. GENERATE DOSSIER FOR EACH SUBURB
                createDossierCard(s, start, end);
            });

        } catch (e) { alert("Error harvesting suburb data."); }
        document.getElementById('loader').style.display = "none";
    }

    function createDossierCard(suburb, start, end) {
        const card = document.createElement('div');
        card.className = 'dossier-card';
        
        // Define filters to focus on crimes, accidents, visits. Exclude sports.
        const baseTerms = `(murder OR crime OR accident OR fire OR disaster OR visit OR "official opening") -sport -results`;
        const dateRange = `${start}..${end}`;
        
        card.innerHTML = `<h4>Archive Search: ${suburb} (${start}-${end})</h4>`;
        
        // Trove (The Gold Standard for AU)
        const troveUrl = `https://trove.nla.gov.au/search/advanced/category/newspaper?keyword=${encodeURIComponent(suburb + " " + baseTerms.replace(/[()]/g, ""))}&dateFrom=${start}-01-01&dateTo=${end}-12-31`;
        card.innerHTML += `<a href="${troveUrl}" target="_blank" class="news-link trove-btn">🇦🇺 Trove (National Library)</a>`;

        // The Age (Melbourne)
        const ageUrl = `https://www.google.com/search?q=site:theage.com.au+"${encodeURIComponent(suburb)}"+${encodeURIComponent(baseTerms)}+${dateRange}`;
        card.innerHTML += `<a href="${ageUrl}" target="_blank" class="news-link">🗞️ The Age</a>`;

        // Sydney Morning Herald
        const smhUrl = `https://www.google.com/search?q=site:smh.com.au+"${encodeURIComponent(suburb)}"+${encodeURIComponent(baseTerms)}+${dateRange}`;
        card.innerHTML += `<a href="${smhUrl}" target="_blank" class="news-link">🗞️ SMH</a>`;

        // ABC News
        const abcUrl = `https://www.google.com/search?q=site:abc.net.au+"${encodeURIComponent(suburb)}"+${encodeURIComponent(baseTerms)}+${dateRange}`;
        card.innerHTML += `<a href="${abcUrl}" target="_blank" class="news-link">📡 ABC News</a>`;

        // Herald Sun / News Corp
        const hsUrl = `https://www.google.com/search?q=site:heraldsun.com.au+"${encodeURIComponent(suburb)}"+${encodeURIComponent(baseTerms)}+${dateRange}`;
        card.innerHTML += `<a href="${hsUrl}" target="_blank" class="news-link">📰 Herald Sun</a>`;

        document.getElementById('dossierContent').appendChild(card);
    }
</script>
</body>
</html>
