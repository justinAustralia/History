<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AU History: Strict Intel Search</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --cobalt: #001f3f; --gold: #ffca28; --paper: #fdfaf5; --danger: #b71c1c; --green: #2e7d32; }
        body { margin: 0; font-family: 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; background: var(--paper); color: #333; }
        
        /* Navigation & UI */
        #header { padding: 15px 25px; background: var(--cobalt); color: white; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; z-index: 1001; }
        #settings-bar { background: #00152b; padding: 10px 25px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--gold); z-index: 1000; }
        #map { flex-grow: 1; width: 100%; box-shadow: inset 0 0 15px rgba(0,0,0,0.4); }
        #results-container { display: flex; height: 320px; background: white; border-top: 1px solid #ccc; }

        /* Controls */
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 10px; text-transform: uppercase; color: var(--gold); font-weight: bold; letter-spacing: 1px; }
        input, button { padding: 10px; border-radius: 4px; border: 1px solid #444; font-size: 14px; }
        .btn-main { background: var(--gold); color: #000; font-weight: bold; cursor: pointer; border: none; min-width: 200px; }
        .btn-main:hover { background: #ffd54f; }

        /* Toggle */
        .switch-container { display: flex; align-items: center; gap: 10px; color: white; font-size: 12px; font-weight: bold; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; transition: .3s; border-radius: 20px; border: 1px solid var(--gold); }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background: var(--green); border-color: var(--green); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* Panels */
        #incident-feed { flex: 2; overflow-y: auto; border-right: 1px solid #ddd; padding: 15px; }
        #web-leads { flex: 1; overflow-y: auto; background: #f8f9fa; padding: 15px; }
        .section-title { font-size: 11px; font-weight: 900; color: var(--cobalt); border-bottom: 2px solid var(--cobalt); margin-bottom: 12px; padding-bottom: 4px; }

        .item-card { border-bottom: 1px solid #eee; padding: 10px; display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: 0.1s; }
        .item-card:hover { background: #fffde7; }
        .item-title { font-weight: bold; font-size: 1em; margin-bottom: 2px; }
        .type-incident { color: var(--danger); }
        .type-landmark { color: var(--green); }
        .item-meta { font-size: 10px; color: #666; font-family: monospace; }
        
        .lead-link { display: block; padding: 8px; background: white; color: #1a0dab; text-decoration: none; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; margin-bottom: 6px; }

        #loader { display: none; color: var(--gold); font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div id="header">
    <div class="input-group" style="flex: 1;">
        <label>1. Location Center (Australia)</label>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="addressInput" placeholder="Suburb or City" style="flex:1">
            <button onclick="searchAddress()" style="background:#333; color:white; cursor:pointer;">Locate</button>
        </div>
    </div>
    <div class="input-group">
        <label>2. Radius: <span id="radLabel">5</span> km</label>
        <input type="range" id="radius" min="1" max="50" value="5">
    </div>
    <div class="input-group">
        <label>3. Dates (1900-2000)</label>
        <div style="display: flex; gap: 5px;">
            <input type="number" id="startYear" value="1900" style="width:75px">
            <input type="number" id="endYear" value="2000" style="width:75px">
        </div>
    </div>
    <button class="btn-main" onclick="executeStrictSearch()">RUN STRICT SEARCH</button>
</div>

<div id="settings-bar">
    <div class="switch-container">
        <span>INCIDENTS ONLY</span>
        <label class="switch">
            <input type="checkbox" id="landmarkToggle">
            <span class="slider"></span>
        </label>
        <span>INCLUDE LANDMARKS</span>
    </div>
    <div id="loader">QUERYING GEOSPATIAL ARCHIVES...</div>
</div>

<div id="map"></div>

<div id="results-container">
    <div id="incident-feed">
        <div class="section-title">VERIFIED COORDINATE MATCHES</div>
        <div id="listContent" style="color: #888;">No results found yet. Specify location and click Run.</div>
    </div>
    <div id="web-leads">
        <div class="section-title">EXTERNAL ARCHIVE LEADS</div>
        <div id="leadLinks"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    let currentCity = "Australia";
    const map = L.map('map').setView([-37.8136, 144.9631], 12); 
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let pin, circle, eventMarkers = L.layerGroup().addTo(map);

    async function searchAddress() {
        const query = document.getElementById('addressInput').value;
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ", Australia")}`);
        const data = await res.json();
        if (data.length > 0) {
            currentCity = data[0].display_name.split(',')[0];
            updateSelection(parseFloat(data[0].lat), parseFloat(data[0].lon), 14);
        }
    }

    function updateSelection(lat, lng, zoom) {
        if (zoom) map.setView([lat, lng], zoom);
        const r = document.getElementById('radius').value;
        if (pin) {
            pin.setLatLng([lat, lng]);
            circle.setLatLng([lat, lng]);
            circle.setRadius(r * 1000);
        } else {
            pin = L.marker([lat, lng], {draggable: true}).addTo(map);
            circle = L.circle([lat, lng], { radius: r * 1000, color: '#ffca28', fillOpacity: 0.1 }).addTo(map);
        }
    }

    map.on('click', e => updateSelection(e.latlng.lat, e.latlng.lng));
    document.getElementById('radius').oninput = (e) => {
        document.getElementById('radLabel').innerText = e.target.value;
        if (circle) circle.setRadius(e.target.value * 1000);
    };

    async function executeStrictSearch() {
        if (!pin) return alert("Please set a map location.");
        
        const {lat, lng} = pin.getLatLng();
        const rad = document.getElementById('radius').value;
        const start = parseInt(document.getElementById('startYear').value);
        const end = parseInt(document.getElementById('endYear').value);
        const includeLandmarks = document.getElementById('landmarkToggle').checked;

        document.getElementById('loader').style.display = "block";
        document.getElementById('listContent').innerHTML = "";
        eventMarkers.clearLayers();

        // 1. External Links strictly limited to current city and timeframe
        generateDossiers(currentCity, start, end);

        // 2. Strict Geospatial Search (Wikidata)
        // This ensures the point is physically within the radius and the date is verified.
        let incidentTypes = "wd:Q838948 wd:Q171558 wd:Q1100989 wd:Q1543115 wd:Q3839 wd:Q214841 wd:Q132241";
        let landmarkTypes = "wd:Q1081138 wd:Q84015776 wd:Q575759 wd:Q49833 wd:Q3013894";
        let targetTypes = includeLandmarks ? (incidentTypes + " " + landmarkTypes) : incidentTypes;

        const sparql = `
        SELECT DISTINCT ?item ?itemLabel ?date ?location ?article ?type WHERE {
          SERVICE wikibase:around {
            ?item wdt:P625 ?location .
            bd:serviceParam wikibase:center "Point(${lng} ${lat})"^^geo:wktLiteral .
            bd:serviceParam wikibase:radius "${rad}" .
          }
          ?item wdt:P31/wdt:P279* ?type .
          VALUES ?type { ${targetTypes} }
          MINUS { ?item wdt:P31/wdt:P279* wd:Q300920 } # Exclude Sports
          
          # Date Filtering
          OPTIONAL { ?item wdt:P585 ?date . } # Specific point in time
          OPTIONAL { ?item wdt:P580 ?date . } # Start time (if no specific point)
          
          # If it's an incident, it MUST have a date in the range. 
          # Landmarks are allowed without dates (permanent sites).
          FILTER(
            (BOUND(?date) && YEAR(?date) >= ${start} && YEAR(?date) <= ${end}) ||
            (${includeLandmarks} && !BOUND(?date))
          )

          SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
          OPTIONAL {
            ?article schema:about ?item .
            ?article schema:inLanguage "en" .
            FILTER (SUBSTR(str(?article), 1, 25) = "https://en.wikipedia.org/")
          }
        } LIMIT 150`;

        try {
            const res = await fetch("https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(sparql));
            const data = await res.json();
            const results = data.results.bindings;

            if (results.length === 0) {
                document.getElementById('listContent').innerHTML = "<p style='padding:15px;'>No verified incidents found matching your spatial and temporal criteria.</p>";
            }

            results.forEach(row => {
                const isL = ["Q1081138","Q84015776","Q575759","Q49833","Q3013894"].some(q => row.type.value.includes(q));
                const coords = row.location.value.replace("Point(","").replace(")","").split(" ");
                const yr = row.date ? new Date(row.date.value).getFullYear() : "Ongoing Site";
                const url = row.article ? row.article.value : row.item.value;

                // Add to Map
                L.circleMarker([coords[1], coords[0]], {
                    radius: 7, fillColor: isL ? "#2e7d32" : "#b71c1c", color: "#000", weight: 1, opacity: 1, fillOpacity: 0.8
                }).addTo(eventMarkers).bindPopup(`<b>${row.itemLabel.value}</b><br>${yr}`);

                // Add to List
                const card = document.createElement('a');
                card.className = 'item-card';
                card.href = url; card.target = "_blank";
                const titleClass = isL ? 'type-landmark' : 'type-incident';
                card.innerHTML = `
                    <div class="item-title ${titleClass}">${row.itemLabel.value}</div>
                    <div class="item-meta">${isL ? 'LANDMARK' : 'INCIDENT'} | ${yr}</div>
                `;
                document.getElementById('listContent').appendChild(card);
            });

        } catch (e) {
            console.error(e);
            alert("Error connecting to geospatial archives.");
        } finally {
            document.getElementById('loader').style.display = "none";
        }
    }

    function generateDossiers(place, start, end) {
        const container = document.getElementById('leadLinks');
        container.innerHTML = "";
        const links = [
            { label: `🌐 Google Search: ${place} (${start}-${end})`, q: `${place} historical crime accident visit celebration -sport ${start}..${end}` },
            { label: `🇦🇺 Trove Newspapers: ${place} (${start}-${end})`, url: `https://trove.nla.gov.au/search/advanced/category/newspaper?keyword=${place}&dateFrom=${start}-01-01&dateTo=${end}-12-31` }
        ];
        links.forEach(l => {
            const a = document.createElement('a');
            a.className = 'lead-link';
            a.href = l.url || `https://www.google.com/search?q=${encodeURIComponent(l.q)}`;
            a.target = "_blank";
            a.innerText = l.label;
            container.appendChild(a);
        });
    }
</script>
</body>
</html>
