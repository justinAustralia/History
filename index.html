<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrated AU History Monitor</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --cobalt: #002147; --gold: #f1b51c; --paper: #f9f7f2; }
        body { margin: 0; font-family: 'Times New Roman', serif; display: flex; flex-direction: column; height: 100vh; background: var(--paper); }
        
        #header { 
            padding: 15px 25px; background: var(--cobalt); color: white; 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; align-items: end; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1001;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; font-family: sans-serif; }
        label { font-size: 11px; text-transform: uppercase; color: var(--gold); font-weight: bold; }
        
        input, button { padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; }
        .btn-main { background: var(--gold); color: black; font-weight: bold; cursor: pointer; border: none; }
        .btn-main:hover { background: #e0a816; }

        #map { flex-grow: 1; width: 100%; border-bottom: 3px solid var(--cobalt); }
        
        #results-panel { height: 300px; overflow-y: auto; background: white; padding: 0; }
        .results-header { padding: 10px 20px; background: #eee; border-bottom: 1px solid #ccc; font-family: sans-serif; position: sticky; top: 0; }

        .event-card { 
            border-bottom: 1px solid #eee; padding: 15px 20px; 
            display: flex; flex-direction: column; text-decoration: none; 
            color: #222; transition: background 0.2s; cursor: pointer;
        }
        .event-card:hover { background: #fdfae6; }
        
        .event-title { font-weight: bold; font-size: 1.2em; color: #8b0000; margin-bottom: 5px; }
        .meta-row { display: flex; gap: 15px; font-size: 12px; font-family: sans-serif; color: #666; }
        .tag { background: #e0e0e0; padding: 2px 6px; border-radius: 3px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        
        #loader { display: none; color: var(--gold); font-size: 12px; font-family: sans-serif; margin-left: 10px; }
    </style>
</head>
<body>

<div id="header">
    <div class="input-group">
        <label>Australian Region</label>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="addressInput" placeholder="Suburb, City or Landmark" style="flex:1">
            <button onclick="searchAddress()" style="cursor:pointer">Go</button>
        </div>
    </div>
    <div class="input-group">
        <label>Search Radius: <span id="radLabel">10</span> km</label>
        <input type="range" id="radius" min="1" max="50" value="10">
    </div>
    <div class="input-group">
        <label>Time Period</label>
        <div style="display: flex; gap: 5px;">
            <input type="number" id="startYear" value="1900">
            <input type="number" id="endYear" value="2000">
        </div>
    </div>
    <div class="input-group">
        <button class="btn-main" onclick="fetchIntegratedHistory()">Search Records</button>
        <div id="loader">Consulting Australian Archives...</div>
    </div>
</div>

<div id="map"></div>

<div id="results-panel">
    <div class="results-header">
        <strong>Integrated Historical Timeline (Wikidata, Wikipedia & Newspaper Records)</strong>
    </div>
    <div id="listContent">
        <p style="padding:20px; color:#666;">Enter an Australian location and click "Search Records" to reveal crimes, accidents, and historic visits.</p>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const map = L.map('map').setView([-37.8136, 144.9631], 12); // Defaults to Melbourne
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let pin, circle, eventMarkers = L.layerGroup().addTo(map);

    // Initial user location
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => updateSelection(pos.coords.latitude, pos.coords.longitude, 13));
    }

    async function searchAddress() {
        const query = document.getElementById('addressInput').value;
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ", Australia")}`);
        const data = await res.json();
        if (data.length > 0) updateSelection(parseFloat(data[0].lat), parseFloat(data[0].lon), 14);
    }

    function updateSelection(lat, lng, zoom) {
        if (zoom) map.setView([lat, lng], zoom);
        if (pin) { pin.setLatLng([lat, lng]); circle.setLatLng([lat, lng]); }
        else {
            pin = L.marker([lat, lng], {draggable: true}).addTo(map);
            circle = L.circle([lat, lng], { radius: document.getElementById('radius').value * 1000, color: '#002147', fillOpacity: 0.1 }).addTo(map);
        }
    }

    map.on('click', e => updateSelection(e.latlng.lat, e.latlng.lng));

    document.getElementById('radius').oninput = (e) => {
        document.getElementById('radLabel').innerText = e.target.value;
        if (circle) circle.setRadius(e.target.value * 1000);
    };

    async function fetchIntegratedHistory() {
        if (!pin) return alert("Select a location on the map first.");
        
        const {lat, lng} = pin.getLatLng();
        const rad = document.getElementById('radius').value;
        const start = document.getElementById('startYear').value;
        const end = document.getElementById('endYear').value;

        document.getElementById('loader').style.display = "block";
        document.getElementById('listContent').innerHTML = "";
        eventMarkers.clearLayers();

        // SPARQL Query: Combined Search for incidents referenced in the Wiki-ecosystem
        // Filters for specific incident types (Crimes, Accidents, etc.) and EXCLUDES Sport (Q300920)
        const query = `
        SELECT DISTINCT ?event ?eventLabel ?date ?location ?article WHERE {
          SERVICE wikibase:around {
            ?event wdt:P625 ?location .
            bd:serviceParam wikibase:center "Point(${lng} ${lat})"^^geo:wktLiteral .
            bd:serviceParam wikibase:radius "${rad}" .
          }
          ?event wdt:P585 ?date .
          ?event wdt:P31/wdt:P279* ?type .
          
          # Incident Types: Crime, Accident, State Visit, Celebration, Disaster, Murder
          VALUES ?type { wd:Q838948 wd:Q171558 wd:Q1100989 wd:Q1543115 wd:Q3839 wd:Q214841 wd:Q132241 }

          # Strict exclusion of sports
          MINUS { ?event wdt:P31/wdt:P279* wd:Q300920 } 
          
          FILTER(YEAR(?date) >= ${start} && YEAR(?date) <= ${end})
          
          SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
          OPTIONAL {
            ?article schema:about ?event .
            ?article schema:inLanguage "en" .
            FILTER (SUBSTR(str(?article), 1, 25) = "https://en.wikipedia.org/")
          }
        } ORDER BY DESC(?date) LIMIT 150`;

        try {
            const res = await fetch("https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(query));
            const data = await res.json();
            const results = data.results.bindings;

            if (results.length === 0) {
                document.getElementById('listContent').innerHTML = "<p style='padding:20px;'>No incidents found in the integrated archives for this radius and timeframe.</p>";
            }

            results.forEach(row => {
                const c = row.location.value.replace("Point(","").replace(")","").split(" ");
                const yr = new Date(row.date.value).getFullYear();
                const sourceUrl = row.article ? row.article.value : row.event.value;
                const sourceName = row.article ? "Wikipedia / News Archive" : "Wikidata Record";

                L.marker([c[1], c[0]]).addTo(eventMarkers).bindPopup(`<b>${row.eventLabel.value}</b><br>${yr}`);

                const card = document.createElement('a');
                card.className = 'event-card';
                card.href = sourceUrl;
                card.target = "_blank";
                card.innerHTML = `
                    <div class="event-title">${row.eventLabel.value}</div>
                    <div class="meta-row">
                        <span>📅 <strong>${yr}</strong></span>
                        <span><span class="tag">${sourceName}</span></span>
                        <span>🇦🇺 Australia Incident</span>
                    </div>
                `;
                document.getElementById('listContent').appendChild(card);
            });
        } catch (e) {
            alert("Archive connection timed out. Please try again.");
        } finally {
            document.getElementById('loader').style.display = "none";
        }
    }
</script>
</body>
</html>
