<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AU History Forensic Portal v17</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { 
            --cobalt: #001f3f; --gold: #ffca28; --paper: #fdfaf5; 
            --event-red: #b71c1c; --landmark-green: #2e7d32; 
            --person-purple: #6a1b9a; --social-blue: #1877F2;
        }
        
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; height: 100vh; background: var(--paper); color: #333; }
        
        #header { padding: 12px; background: var(--cobalt); color: white; display: grid; grid-template-columns: 1fr; gap: 10px; z-index: 1001; box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        @media (min-width: 768px) { #header { grid-template-columns: 2fr 1fr 1fr auto; padding: 15px 25px; align-items: flex-end; } }

        .input-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 10px; text-transform: uppercase; color: var(--gold); font-weight: bold; }
        input, button { padding: 12px; border-radius: 6px; border: 1px solid #444; font-size: 14px; }
        .btn-main { background: var(--gold); color: #000; font-weight: bold; cursor: pointer; border: none; }

        #settings-bar { background: #00152b; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--gold); z-index: 1000; }
        .switch-container { display: flex; align-items: center; gap: 8px; color: white; font-size: 11px; font-weight: bold; }
        .switch { position: relative; width: 40px; height: 22px; display: inline-block; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; transition: .3s; border-radius: 22px; border: 1px solid var(--gold); }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 2px; background: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background: var(--landmark-green); }
        input:checked + .slider:before { transform: translateX(18px); }

        #map { flex: 0 0 35vh; width: 100%; }
        @media (min-width: 768px) { #map { flex: 1; } }
        
        #results-container { display: flex; flex-direction: column; background: white; overflow-y: auto; }
        @media (min-width: 768px) { #results-container { flex-direction: row; height: 400px; overflow: hidden; } }

        #incident-feed { flex: 1.6; overflow-y: auto; border-bottom: 1px solid #ddd; padding: 15px; }
        #intel-dossier { flex: 1.4; overflow-y: auto; background: #f1f3f5; padding: 15px; }
        @media (min-width: 768px) { #incident-feed { border-bottom: none; border-right: 1px solid #ddd; } }

        .section-title { font-size: 11px; font-weight: 900; color: var(--cobalt); border-bottom: 2px solid var(--cobalt); margin-bottom: 12px; padding-bottom: 4px; text-transform: uppercase; }
        
        .item-card { border-bottom: 1px solid #eee; padding: 14px 12px; display: block; text-decoration: none; color: inherit; position: relative; }
        .item-card:hover { background: #fffde7; }
        .item-title { font-weight: 800; font-size: 14px; margin-bottom: 4px; padding-right: 85px; line-height: 1.3; }
        
        .type-event .item-title { color: var(--event-red); }
        .type-landmark .item-title { color: var(--landmark-green); }
        .type-person .item-title { color: var(--person-purple); }

        .status-badge { position: absolute; top: 14px; right: 12px; font-size: 8px; font-weight: 900; padding: 3px 6px; border-radius: 4px; text-transform: uppercase; text-align: center; width: 75px; }
        .type-event .status-badge { background: #ffebee; color: var(--event-red); border: 1px solid var(--event-red); }
        .type-landmark .status-badge { background: #e8f5e9; color: var(--landmark-green); border: 1px solid var(--landmark-green); }
        .type-person .status-badge { background: #f3e5f5; color: var(--person-purple); border: 1px solid var(--person-purple); }

        .item-meta { font-size: 11px; color: #666; font-family: monospace; }
        .suburb-intel-block { background: white; border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
        .social-link { padding: 8px; border-radius: 4px; text-decoration: none; font-size: 10px; font-weight: bold; color: white; text-align: center; }
        
        #loader { display: none; color: var(--gold); font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div id="header">
    <div class="input-group">
        <label>Location (AU)</label>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="addressInput" placeholder="Suburb or Town">
            <button onclick="searchAddress()" style="background:#333; color:white; width: auto; cursor:pointer;">GO</button>
        </div>
    </div>
    <div class="input-group">
        <label>Radius: <span id="radLabel">5</span> km</label>
        <input type="range" id="radius" min="1" max="50" value="5">
    </div>
    <div class="input-group">
        <label>Years</label>
        <div style="display: flex; gap: 5px;">
            <input type="number" id="startYear" value="1900">
            <input type="number" id="endYear" value="2000">
        </div>
    </div>
    <button class="btn-main" onclick="runForensicSearch()">RUN FORENSIC SEARCH</button>
</div>

<div id="settings-bar">
    <div class="switch-container">
        <span>EXCLUDE LANDMARKS</span>
        <label class="switch">
            <input type="checkbox" id="landmarkToggle">
            <span class="slider"></span>
        </label>
        <span>INCLUDE LANDMARKS</span>
    </div>
    <div id="loader">POLISHING DATA CLASSIFICATION...</div>
</div>

<div id="map"></div>

<div id="results-container">
    <div id="incident-feed">
        <div class="section-title">Verified Historical Timeline</div>
        <div id="listContent" style="color:#888; font-size:13px; text-align: center; padding-top: 30px;">
            Awaiting input. Select a location to start.
        </div>
    </div>
    <div id="intel-dossier">
        <div class="section-title">Social & Newspaper Archives</div>
        <div id="intelContent"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const map = L.map('map').setView([-37.81, 144.96], 12); 
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let pin, circle, markers = L.layerGroup().addTo(map);

    async function searchAddress() {
        const q = document.getElementById('addressInput').value;
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q + ", Australia")}&addressdetails=1`);
        const data = await res.json();
        if (data.length > 0) updateSelection(data[0].lat, data[0].lon, 14);
    }

    async function getSuburbs(lat, lng, rad) {
        const query = `[out:json];(node["place"~"suburb|town|village"](around:${rad * 1000},${lat},${lng}););out;`;
        try {
            const res = await fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(query));
            const data = await res.json();
            return [...new Set(data.elements.map(el => el.tags.name))];
        } catch (e) { return []; }
    }

    function updateSelection(lat, lng, zoom) {
        if (zoom) map.setView([lat, lng], zoom);
        const r = document.getElementById('radius').value;
        if (pin) { pin.setLatLng([lat, lng]); circle.setLatLng([lat, lng]); circle.setRadius(r * 1000); }
        else {
            pin = L.marker([lat, lng], {draggable: true}).addTo(map);
            circle = L.circle([lat, lng], { radius: r * 1000, color: '#ffca28', fillOpacity: 0.1 }).addTo(map);
        }
    }

    map.on('click', e => updateSelection(e.latlng.lat, e.latlng.lng));
    document.getElementById('radius').oninput = (e) => {
        document.getElementById('radLabel').innerText = e.target.value;
        if (circle) circle.setRadius(e.target.value * 1000);
    };

    async function runForensicSearch() {
        if (!pin) return alert("Select a location.");
        const {lat, lng} = pin.getLatLng();
        const rad = document.getElementById('radius').value;
        const start = document.getElementById('startYear').value;
        const end = document.getElementById('endYear').value;
        const showL = document.getElementById('landmarkToggle').checked;

        document.getElementById('loader').style.display = "block";
        document.getElementById('listContent').innerHTML = "";
        document.getElementById('intelContent').innerHTML = "";
        markers.clearLayers();

        const suburbs = await getSuburbs(lat, lng, rad);
        suburbs.slice(0, 5).forEach(sub => generateSuburbIntel(sub, start, end));

        await Promise.all([
            fetchWikidataStrict(lat, lng, rad, start, end, showL),
            ...suburbs.slice(0, 3).map(s => fetchWikipediaText(s, start, end))
        ]);

        document.getElementById('loader').style.display = "none";
    }

    async function fetchWikidataStrict(lat, lng, rad, s, e, showL) {
        // Query returns ?isPerson and ?isLandmark as boolean flags from the database itself
        const query = `SELECT DISTINCT ?item ?itemLabel ?date ?loc ?isPerson ?isLandmark WHERE {
            SERVICE wikibase:around {
                ?item wdt:P625 ?loc .
                bd:serviceParam wikibase:center "Point(${lng} ${lat})"^^geo:wktLiteral .
                bd:serviceParam wikibase:radius "${rad}" .
            }
            # Mandatory date check
            ?item wdt:P585|wdt:P580|wdt:P569|wdt:P570 ?date .
            FILTER(YEAR(?date) >= ${s} && YEAR(?date) <= ${e})
            
            # Classification Logic
            BIND(EXISTS {?item wdt:P31/wdt:P279* wd:Q5} AS ?isPerson)
            BIND(EXISTS {?item wdt:P31/wdt:P279* wd:Q1081138} AS ?isLandmark) # Subclass of Historic Site
            
            MINUS { ?item wdt:P31/wdt:P279* wd:Q300920 } # Exclude Sports
            
            SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
        } LIMIT 80`;

        try {
            const res = await fetch("https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(query));
            const data = await res.json();
            data.results.bindings.forEach(row => {
                const isP = row.isPerson.value === "true";
                const isL = row.isLandmark.value === "true";
                if (!showL && isL && !isP) return;
                renderItem(row.itemLabel.value, new Date(row.date.value).getFullYear(), row.item.value, isL, isP, row.loc.value);
            });
        } catch(err) {}
    }

    async function fetchWikipediaText(suburb, s, e) {
        const query = `"${suburb}" (history OR incident OR murder OR fire) -sport`;
        const url = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*`;
        try {
            const res = await fetch(url);
            const data = await res.json();
            data.query.search.forEach(item => {
                const yearMatch = item.snippet.match(/\b(19\d{2}|2000)\b/);
                if (yearMatch) {
                    // Logic to avoid mislabeling people in text search
                    const actionKeywords = ["murder", "fire", "riot", "accident", "visit", "opening", "bridge", "battle"];
                    const isEventLike = actionKeywords.some(kw => item.title.toLowerCase().includes(kw) || item.snippet.toLowerCase().includes(kw));
                    renderItem(item.title, yearMatch[0], `https://en.wikipedia.org/?curid=${item.pageid}`, false, !isEventLike, null);
                }
            });
        } catch(e) {}
    }

    function renderItem(title, yr, url, isL, isP, locStr) {
        let type = 'event'; 
        if (isP) type = 'person';
        if (isL) type = 'landmark';

        const markerColor = { 'person': '#6a1b9a', 'landmark': '#2e7d32', 'event': '#b71c1c' }[type];
        const label = { 'person': 'Person', 'landmark': 'Landmark', 'event': 'Event' }[type];

        if (locStr) {
            const c = locStr.replace("Point(","").replace(")","").split(" ");
            L.circleMarker([c[1], c[0]], { radius: 8, fillColor: markerColor, color: "#000", weight: 1, fillOpacity: 0.8 }).addTo(markers);
        }

        const card = document.createElement('a');
        card.className = `item-card type-${type}`; card.href = url; card.target = "_blank";
        card.innerHTML = `<div class="item-title">${title}</div><div class="status-badge">${label}</div><div class="item-meta">YEAR: ${yr}</div>`;
        document.getElementById('listContent').prepend(card);
    }

    function generateSuburbIntel(suburb, start, end) {
        const block = document.createElement('div');
        block.className = 'suburb-intel-block';
        block.innerHTML = `<h4>${suburb}</h4><div class="social-grid">
            <a href="https://www.facebook.com/search/groups/?q=Lost ${suburb} History" target="_blank" class="social-link" style="background:var(--social-blue)">Facebook</a>
            <a href="https://www.reddit.com/search/?q=${suburb} history" target="_blank" class="social-link" style="background:#FF4500">Reddit</a>
            <a href="https://www.youtube.com/results?search_query=${suburb} history ${start} ${end}" target="_blank" class="social-link" style="background:#FF0000">YouTube</a>
            <a href="https://trove.nla.gov.au/search/advanced/category/newspaper?keyword=${suburb}&dateFrom=${start}-01-01&dateTo=${end}-12-31" target="_blank" class="social-link" style="background:#8b0000">Trove</a>
        </div>`;
        document.getElementById('intelContent').appendChild(block);
    }
</script>
</body>
</html>
