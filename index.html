<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AU Historical Intelligence Portal v4.0</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --cobalt: #001f3f; --gold: #ffca28; --paper: #fdfaf5; --danger: #b71c1c; --green: #2e7d32; --shadow: rgba(0,0,0,0.2); }
        body { margin: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; background: var(--paper); color: #333; }
        
        /* Layout Components */
        #header { padding: 15px 25px; background: var(--cobalt); color: white; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; z-index: 1001; }
        #settings-bar { background: #00152b; padding: 10px 25px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--gold); z-index: 1000; }
        #map { flex-grow: 1; width: 100%; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); }
        #results-container { display: flex; height: 380px; background: white; border-top: 1px solid #ccc; }

        /* UI Elements */
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        label { font-size: 10px; text-transform: uppercase; color: var(--gold); font-weight: bold; letter-spacing: 1px; }
        input, button { padding: 10px; border-radius: 4px; border: 1px solid #444; font-size: 14px; }
        .btn-main { background: var(--gold); color: #000; font-weight: bold; cursor: pointer; border: none; min-width: 200px; transition: 0.2s; }
        .btn-main:hover { background: #ffd54f; box-shadow: 0 0 15px var(--gold); }

        /* Toggle Switch */
        .switch-container { display: flex; align-items: center; gap: 10px; color: white; font-size: 12px; font-weight: bold; }
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #333; transition: .3s; border-radius: 22px; border: 1px solid var(--gold); }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 4px; bottom: 3px; background: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background: var(--green); border-color: var(--green); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Panels */
        #incident-feed { flex: 2; overflow-y: auto; border-right: 1px solid #ddd; padding: 15px; }
        #web-leads { flex: 1.2; overflow-y: auto; background: #f8f9fa; padding: 15px; }
        .section-title { font-size: 12px; font-weight: 900; color: var(--cobalt); border-bottom: 2px solid var(--cobalt); margin-bottom: 12px; padding-bottom: 4px; display: flex; justify-content: space-between; }

        .item-card { border-bottom: 1px solid #eee; padding: 12px; display: flex; flex-direction: column; text-decoration: none; color: inherit; transition: 0.2s; }
        .item-card:hover { background: #fffde7; }
        .item-title { font-weight: bold; font-size: 1.1em; margin-bottom: 3px; }
        .type-incident { color: var(--danger); }
        .type-landmark { color: var(--green); }
        .item-meta { font-size: 11px; color: #666; font-family: monospace; }
        
        .lead-link { display: block; padding: 10px; background: white; color: #1a0dab; text-decoration: none; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; margin-bottom: 8px; font-weight: 500; }
        .lead-link:hover { border-color: var(--cobalt); background: #eee; }
        .lead-tag { font-size: 9px; background: #eee; padding: 2px 5px; border-radius: 3px; color: #444; margin-right: 5px; }

        #loader { display: none; color: var(--gold); font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

<div id="header">
    <div class="input-group" style="flex: 2;">
        <label>1. Target Location (Australia)</label>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="addressInput" placeholder="Enter Suburb, City, or Specific Street" style="flex:1">
            <button onclick="searchAddress()" style="cursor:pointer; background:#333; color:white;">Set Coordinates</button>
        </div>
    </div>
    <div class="input-group">
        <label>2. Radius: <span id="radLabel">5</span> km</label>
        <input type="range" id="radius" min="1" max="50" value="5">
    </div>
    <div class="input-group">
        <label>3. Year Range</label>
        <div style="display: flex; gap: 5px;">
            <input type="number" id="startYear" value="1900" style="width:75px">
            <input type="number" id="endYear" value="2000" style="width:75px">
        </div>
    </div>
    <button class="btn-main" onclick="executeInquiry()">DEEP INTEL SEARCH</button>
</div>

<div id="settings-bar">
    <div class="switch-container">
        <span>INCIDENTS ONLY</span>
        <label class="switch">
            <input type="checkbox" id="landmarkToggle">
            <span class="slider"></span>
        </label>
        <span>INCLUDE LANDMARKS</span>
    </div>
    <div id="loader">SEARCHING WIKIPEDIA, WIKIDATA & WEB ARCHIVES...</div>
</div>

<div id="map"></div>

<div id="results-container">
    <div id="incident-feed">
        <div class="section-title">CHRONOLOGICAL DATABASE MATCHES</div>
        <div id="listContent" style="color: #666; font-style: italic;">No search active. Enter location to begin inquiry.</div>
    </div>
    <div id="web-leads">
        <div class="section-title">EXTERNAL INVESTIGATION LEADS</div>
        <div id="leadLinks"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    let currentPlaceName = "Australia";
    const map = L.map('map').setView([-37.8136, 144.9631], 12); 
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let pin, circle, eventMarkers = L.layerGroup().addTo(map);

    async function searchAddress() {
        const query = document.getElementById('addressInput').value;
        if(!query) return;
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ", Australia")}`);
        const data = await res.json();
        if (data.length > 0) {
            currentPlaceName = data[0].display_name.split(',')[0];
            updateSelection(parseFloat(data[0].lat), parseFloat(data[0].lon), 14);
        }
    }

    function updateSelection(lat, lng, zoom) {
        if (zoom) map.setView([lat, lng], zoom);
        const radiusVal = document.getElementById('radius').value;
        if (pin) {
            pin.setLatLng([lat, lng]);
            circle.setLatLng([lat, lng]);
            circle.setRadius(radiusVal * 1000);
        } else {
            pin = L.marker([lat, lng], {draggable: true}).addTo(map);
            circle = L.circle([lat, lng], { radius: radiusVal * 1000, color: '#ffca28', fillOpacity: 0.1, weight: 2 }).addTo(map);
        }
    }

    map.on('click', e => updateSelection(e.latlng.lat, e.latlng.lng));
    document.getElementById('radius').oninput = (e) => {
        document.getElementById('radLabel').innerText = e.target.value;
        if (circle) circle.setRadius(e.target.value * 1000);
    };

    async function executeInquiry() {
        if (!pin) return alert("Select a location on the map first.");
        
        const {lat, lng} = pin.getLatLng();
        const rad = document.getElementById('radius').value;
        const start = document.getElementById('startYear').value;
        const end = document.getElementById('endYear').value;
        const landmarks = document.getElementById('landmarkToggle').checked;

        document.getElementById('loader').style.display = "block";
        document.getElementById('listContent').innerHTML = "";
        eventMarkers.clearLayers();

        // 1. Generate Investigation Dossiers
        generateWebDossiers(currentPlaceName, start, end);

        // 2. Multi-threaded Search
        const tasks = [
            fetchWikidata(lat, lng, rad, start, end, landmarks),
            fetchWikipediaChronology(currentPlaceName, start, end)
        ];

        await Promise.all(tasks);
        document.getElementById('loader').style.display = "none";
    }

    async function fetchWikidata(lat, lng, rad, start, end, includeLandmarks) {
        let incidentTypes = "wd:Q838948 wd:Q171558 wd:Q1100989 wd:Q1543115 wd:Q3839 wd:Q214841 wd:Q132241";
        let landmarkTypes = "wd:Q1081138 wd:Q84015776 wd:Q575759 wd:Q49833 wd:Q3013894";
        let types = includeLandmarks ? (incidentTypes + " " + landmarkTypes) : incidentTypes;

        const query = `
        SELECT DISTINCT ?event ?eventLabel ?date ?location ?article ?type WHERE {
          SERVICE wikibase:around {
            ?event wdt:P625 ?location .
            bd:serviceParam wikibase:center "Point(${lng} ${lat})"^^geo:wktLiteral .
            bd:serviceParam wikibase:radius "${rad}" .
          }
          ?event wdt:P31/wdt:P279* ?type .
          VALUES ?type { ${types} }
          MINUS { ?event wdt:P31/wdt:P279* wd:Q300920 } # No Sport
          OPTIONAL { ?event wdt:P585 ?date . }
          FILTER(!BOUND(?date) || (YEAR(?date) >= ${start} && YEAR(?date) <= ${end}))
          SERVICE wikibase:label { bd:serviceParam wikibase:language "en".
