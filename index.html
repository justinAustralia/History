<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AU History Archive: 1900-2000</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --au-green: #1b3022; --au-gold: #ffca28; --paper: #f4f1ea; }
        body { margin: 0; font-family: 'Georgia', serif; display: flex; flex-direction: column; height: 100vh; background: var(--paper); }
        
        #header { 
            padding: 15px 25px; background: var(--au-green); color: white; 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px; align-items: end; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1001;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 11px; text-transform: uppercase; color: var(--au-gold); font-family: sans-serif; font-weight: bold; }
        
        input, button { padding: 10px; border-radius: 4px; border: 1px solid #344e41; font-size: 14px; }
        .btn-main { background: var(--au-gold); color: black; font-weight: bold; cursor: pointer; border: none; font-family: sans-serif; }
        .btn-main:hover { background: #ffd54f; }

        #map { flex-grow: 1; width: 100%; border-bottom: 3px solid var(--au-green); }
        
        #results-panel { height: 280px; display: flex; background: white; border-top: 1px solid #ccc; }
        
        #event-list { flex: 2; overflow-y: auto; border-right: 1px solid #eee; padding: 10px; }
        #archive-links { flex: 1; overflow-y: auto; padding: 15px; background: #f9f9f9; }

        .event-card { 
            border-bottom: 1px solid #eee; padding: 12px; display: flex; flex-direction: column; 
            text-decoration: none; color: #333; transition: 0.2s; cursor: pointer;
        }
        .event-card:hover { background: #fffdf0; }
        .event-title { font-weight: bold; color: #8b0000; font-size: 1.1em; }
        
        .source-tag { font-size: 10px; font-family: sans-serif; padding: 2px 5px; border-radius: 3px; margin-right: 5px; background: #ddd; }
        .tag-wiki { background: #e1f5fe; color: #0288d1; }
        .tag-trove { background: #fff3e0; color: #ef6c00; }

        .archive-btn { 
            display: block; width: 100%; padding: 8px; margin-bottom: 8px; 
            text-align: center; text-decoration: none; font-size: 12px;
            border: 1px solid #ccc; border-radius: 4px; color: #333; background: white; font-family: sans-serif;
        }
        .archive-btn:hover { background: #eee; }
        
        #loader { display: none; color: var(--au-gold); font-size: 12px; font-family: sans-serif; }
    </style>
</head>
<body>

<div id="header">
    <div class="input-group">
        <label>Australian Location</label>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="addressInput" placeholder="Suburb or City" style="flex:1">
            <button onclick="searchAddress()">Go</button>
        </div>
    </div>
    <div class="input-group">
        <label>Radius: <span id="radLabel">10</span> km</label>
        <input type="range" id="radius" min="1" max="50" value="10">
    </div>
    <div class="input-group">
        <label>Years</label>
        <div style="display: flex; gap: 5px;">
            <input type="number" id="startYear" value="1900">
            <input type="number" id="endYear" value="2000">
        </div>
    </div>
    <div class="input-group">
        <button class="btn-main" onclick="runInquiry()">Search Archives</button>
        <div id="loader">Consulting Wikidata & Trove...</div>
    </div>
</div>

<div id="map"></div>

<div id="results-panel">
    <div id="event-list">
        <div style="padding:10px; color:#666;">Select a location on the map. Search results from Wikipedia and Wikidata will appear here.</div>
    </div>
    <div id="archive-links">
        <label>Direct Newspaper Search</label>
        <div id="troveButtons" style="margin-top:10px;">
            <small>Set a location and click search to generate newspaper archive links.</small>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    let currentPlaceName = "Australia";
    const map = L.map('map').setView([-37.8136, 144.9631], 12); // Default Melbourne
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let pin, circle, eventMarkers = L.layerGroup().addTo(map);

    // Initial Geolocation
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => updateSelection(pos.coords.latitude, pos.coords.longitude, 13));
    }

    async function searchAddress() {
        const query = document.getElementById('addressInput').value;
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ", Australia")}`);
        const data = await res.json();
        if (data.length > 0) {
            currentPlaceName = data[0].display_name.split(',')[0];
            updateSelection(parseFloat(data[0].lat), parseFloat(data[0].lon), 14);
        }
    }

    function updateSelection(lat, lng, zoom) {
        if (zoom) map.setView([lat, lng], zoom);
        if (pin) { pin.setLatLng([lat, lng]); circle.setLatLng([lat, lng]); }
        else {
            pin = L.marker([lat, lng], {draggable: true}).addTo(map);
            circle = L.circle([lat, lng], { radius: document.getElementById('radius').value * 1000, color: '#1b3022', fillOpacity: 0.1 }).addTo(map);
        }
    }

    map.on('click', e => updateSelection(e.latlng.lat, e.latlng.lng));

    document.getElementById('radius').oninput = (e) => {
        document.getElementById('radLabel').innerText = e.target.value;
        if (circle) circle.setRadius(e.target.value * 1000);
    };

    async function runInquiry() {
        if (!pin) return alert("Please select a location on the map.");
        
        const {lat, lng} = pin.getLatLng();
        const rad = document.getElementById('radius').value;
        const start = document.getElementById('startYear').value;
        const end = document.getElementById('endYear').value;

        document.getElementById('loader').style.display = "block";
        document.getElementById('event-list').innerHTML = "";
        eventMarkers.clearLayers();

        // 1. GENERATE DEEP LINKS FOR AUSTRALIAN NEWSPAPERS (TROVE)
        generateTroveLinks(currentPlaceName, start, end);

        // 2. WIKIDATA / WIKIPEDIA QUERY
        // Filters: Crimes, Accidents, Visits, Disasters. EXCLUDES Sports (Q300920).
        const query = `
        SELECT DISTINCT ?event ?eventLabel ?date ?location ?article WHERE {
          SERVICE wikibase:around {
            ?event wdt:P625 ?location .
            bd:serviceParam wikibase:center "Point(${lng} ${lat})"^^geo:wktLiteral .
            bd:serviceParam wikibase:radius "${rad}" .
          }
          ?event wdt:P585 ?date .
          ?event wdt:P31/wdt:P279* ?type .
          VALUES ?type { wd:Q838948 wd:Q171558 wd:Q1100989 wd:Q3839 wd:Q214841 wd:Q1543115 wd:Q132241 }
          MINUS { ?event wdt:P31/wdt:P279* wd:Q300920 } 
          FILTER(YEAR(?date) >= ${start} && YEAR(?date) <= ${end})
          SERVICE wikibase:label { bd:serviceParam wikibase:language "en". }
          OPTIONAL {
            ?article schema:about ?event .
            ?article schema:inLanguage "en" .
            FILTER (SUBSTR(str(?article), 1, 25) = "https://en.wikipedia.org/")
          }
        } ORDER BY DESC(?date) LIMIT 100`;

        try {
            const res = await fetch("https://query.wikidata.org/sparql?format=json&query=" + encodeURIComponent(query));
            const data = await res.json();
            const results = data.results.bindings;

            if (results.length === 0) {
                document.getElementById('event-list').innerHTML = "<div style='padding:20px;'>No structured events found for this radius. Use the Archive links on the right for newspaper records.</div>";
            }

            results.forEach(row => {
                const c = row.location.value.replace("Point(","").replace(")","").split(" ");
                const yr = new Date(row.date.value).getFullYear();
                const wikiLink = row.article ? row.article.value : row.event.value;

                L.marker([c[1], c[0]]).addTo(eventMarkers).bindPopup(`<b>${row.eventLabel.value}</b><br>${yr}`);

                const card = document.createElement('a');
                card.className = 'event-card';
                card.href = wikiLink;
                card.target = "_blank";
                card.innerHTML = `
                    <div class="event-title">${row.eventLabel.value}</div>
                    <div style="margin-top:5px;">
                        <span class="source-tag tag-wiki">${row.article ? 'Wikipedia' : 'Wikidata'}</span>
                        <span style="font-size:12px; color:#666;">📅 ${yr}</span>
                    </div>
                `;
                document.getElementById('event-list').appendChild(card);
            });
        } catch (e) {
            alert("Error fetching data.");
        } finally {
            document.getElementById('loader').style.display = "none";
        }
    }

    function generateTroveLinks(place, start, end) {
        const troveBase = "https://trove.nla.gov.au/search/advanced/category/newspaper";
        const queryParams = `?keyword=${encodeURIComponent(place)}&dateFrom=${start}-01-01&dateTo=${end}-12-31`;
        
        const linksHtml = `
            <p style="font-size:12px; margin-bottom:10px;">Searching newspapers for <b>${place}</b> (${start}-${end}):</p>
            <a class="archive-btn" href="${troveBase}${queryParams}" target="_blank">🔍 All Trove Newspapers</a>
            <a class="archive-btn" href="${troveBase}${queryParams}&l-title=13" target="_blank">🗞️ The Age (Melbourne)</a>
            <a class="archive-btn" href="${troveBase}${queryParams}&l-title=35" target="_blank">🗞️ Sydney Morning Herald</a>
            <a class="archive-btn" href="${troveBase}${queryParams}&l-title=11" target="_blank">🗞️ The Argus (Melbourne)</a>
            <p style="font-size:10px; color:#777; margin-top:10px;">Note: Trove links include Accidents, Crimes, and Official Visits found in OCR text.</p>
        `;
        document.getElementById('troveButtons').innerHTML = linksHtml;
    }
</script>
</body>
</html>
